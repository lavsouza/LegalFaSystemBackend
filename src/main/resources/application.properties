# ===============================
# DATABASE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/legalfasystem
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# LOGGING (opcional, mas ajuda MUITO)
# ===============================
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.type.descriptor.sql=trace

api.security.token.secret =${JWT_SECRET:my-secret-key}
# Configurações críticas para evitar truncamento
server.tomcat.max-http-response-header-size=65536
server.max-http-header-size=65536
server.tomcat.max-swallow-size=10MB
server.tomcat.max-keep-alive-requests=1

# Desabilitar compressão completamente
server.compression.enabled=false

# Aumentar buffer de resposta
server.tomcat.basedir=./tomcat
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.directory=./logs
server.tomcat.accesslog.pattern=%h %l %u %t "%r" %s %b %D

# Jackson
spring.jackson.serialization.indent_output=true
spring.jackson.default-property-inclusion=always
spring.jackson.serialization.fail-on-empty-beans=false